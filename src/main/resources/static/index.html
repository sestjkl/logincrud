<!DOCTYPE html>
<!-- index.html -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Crud de Usuarios</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>

<div class="card">
    <div class="card-bg card-bg-1"></div>
    <div class="card-bg card-bg-2"></div>

    <!-- Switch para Login Screen -->
    <div class="switch login">
        <i class="bi bi-person-fill"></i>
        <button type="button" class="switch-btn">
            Cadastro
            <i class="bi bi-arrow-right"></i>
        </button>
    </div>

    <!-- Switch para Register Screen -->
    <div class="switch register">
        <div class="switch-brand">
            <img class="logo" src="logo.svg" alt="" />
            <span class="brand"></span>
        </div>
        <button type="button" class="switch-btn">
            Entrar
            <i class="bi bi-arrow-right"></i>
        </button>
    </div>

    <!-- Form para Login -->
    <div class="form login">
        <form action="/login" method="post">
            <h2>Bem vindo de volta </h2>

            <div class="input-group">
                <label for="username">Usuario</label>
                <input type="text" name="username" id="username" placeholder="Seu usuário" required>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" name="password" id="password" placeholder="Sua senha " required>
            </div>

            <button type="submit" class="btn-submit">Entrar</button>
            <p class="texto-maiusculo"> OU </p>

            <!-- Botão Entrar com o Google Moderno -->
            <div class="mt-4">
                <button type="button" onclick="handleGoogleLogin()" class="btn-google">
                    <!-- Ícone SVG do Google Redimensionado (20x20) -->
                    <svg width="20" height="20" viewBox="0 0 24 24" class="shrink-0">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Entrar com o Google</span>
                </button>
            </div>




        </form>
    </div>

    <!-- Form para Register -->
    <div class="form register">
        <form action="/register" method="post">
            <h2>Criar Conta</h2>

            <div class="input-group">
                <label for="reg-username">Usuario</label>
                <input type="text" name="username" id="reg-username" placeholder="Digite seu Usuario" required>
            </div>

            <div class="input-group">
                <label for="reg-password">Senha</label>
                <input type="password" name="password" id="reg-password" placeholder="Digite sua Senha" required>
            </div>

            <div class="input-group">
                <label for="reg-email">E-mail</label>
                <input type="email" name="email" id="reg-email" placeholder="Digite seu E-mail" required>
            </div>

            <button type="submit" class="btn-submit">Cadastrar</button>
        </form>
    </div>

</div>




<footer class="footer-container">
    <section>
        <ul class="socials">
            <li>
                <a class="social-icon" data-tooltip="Github" aria-label="Github">
                    <i class="bi bi-github"></i>
                </a>
            </li>
            <li>
                <a class="social-icon" data-tooltip="CodePen" aria-label="CodePen">
                    <i class="bi bi-code-slash"></i>
                </a>
            </li>
            <li>
                <a class="social-icon" data-tooltip="Dribbble" aria-label="Dribbble">
                    <i class="bi bi-dribbble"></i>
                </a>
            </li>
        </ul>
        <ul class="links">
            <li><a>Portfolio</a></li>
            <li><a>Skills</a></li>
            <li><a>Contact</a></li>
        </ul>
        <p class="legal">&copy; Projeto criado em 2026 <br> Desenvolvido por Lucas jesus </p>
    </section>
</footer>


<script src="js/main.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
